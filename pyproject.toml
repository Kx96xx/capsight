[project]
name = "capsight"
version = "0.3.0"
description = "Drop in a 4G/5G packet capture, get a plain-English diagnosis of why a device couldn't attach, register or get data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

authors = [{ name = "Kx96xx" }]
keywords = ["pcap", "wireshark", "tshark", "lte", "5g", "diameter", "gtp", "pfcp", "ngap", "map", "ss7", "sigtran", "telecom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
web = ["gradio>=4"]

[project.urls]
Homepage = "https://github.com/Kx96xx/capsight"
Issues = "https://github.com/Kx96xx/capsight/issues"

[project.scripts]
capsight = "capsight.cli:main"
capsight-web = "capsight.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
